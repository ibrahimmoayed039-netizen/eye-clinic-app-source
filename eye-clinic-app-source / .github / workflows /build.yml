name: بناء البرنامج (Build Desktop App)

# يعمل هذا الملف تلقائيًا عند:
# - رفع (push) وسم إصدار مثل v1.0.0 أو v1.2.3 → يبني ويرفق الملفات كإصدار (Release) على GitHub
# - تشغيله يدويًا من تبويب Actions في المستودع (workflow_dispatch)
# - أي Pull Request إلى main، للتأكد أن البناء لا يزال يعمل بدون مشاكل (بدون نشر إصدار)
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write   # مطلوب فقط لإنشاء الإصدار (Release) عند رفع وسم

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
            artifact-name: windows-build
            artifact-path: dist/*.exe
          - os: ubuntu-latest
            build-script: build:linux
            artifact-name: linux-build
            artifact-path: dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: تنزيل الكود (Checkout)
        uses: actions/checkout@v4

      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت الحزم (npm ci)
        run: npm ci

      - name: بناء البرنامج (${{ matrix.build-script }})
        run: npm run ${{ matrix.build-script }}
        env:
          # يتيح لـ electron-builder نشر الإصدار مباشرة على GitHub عند وجود وسم (tag)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: رفع نتاج البناء كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: إرفاق الملف بالإصدار (Release) عند رفع وسم
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-path }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
